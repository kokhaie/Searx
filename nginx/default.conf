# Real-IP: unwrap the first hop so rate limiting works correctly even behind
# Docker's internal network or a CDN. Adjust the CIDR to match your setup.
real_ip_header     X-Forwarded-For;
real_ip_recursive  on;
set_real_ip_from   10.0.0.0/8;
set_real_ip_from   172.16.0.0/12;
set_real_ip_from   192.168.0.0/16;

# Rate limiting zones (shared memory)
# With real_ip above, $binary_remote_addr now reflects the actual client IP.
limit_req_zone $binary_remote_addr zone=search_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=general_api:10m rate=10r/s;

upstream nuxt {
    server app:3000;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 100;
}


# ============================================
# HTTPS — direct access to VPS (self-signed)
# ============================================
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    http2 on;

    keepalive_timeout 65s;
    keepalive_requests 10000;

    # Security headers applied to every response
    add_header X-Frame-Options            "DENY"            always;
    add_header X-Content-Type-Options     "nosniff"         always;
    add_header Referrer-Policy            "no-referrer"     always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:;" always;

    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /api/search {
        limit_req zone=search_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nuxt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/suggest {
        limit_req zone=general_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://nuxt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        proxy_pass http://nuxt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
