# Rate limiting zones (shared memory)
# NOTE: Behind Cloudflare Tunnel / Iranian CDN, $binary_remote_addr is the CDN/Tunnel IP,
# not the end user. For true per-user limits use Cloudflare Rate Limiting dashboard.
limit_req_zone $binary_remote_addr zone=search_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=general_api:10m rate=10r/s;

upstream nuxt {
    server search-app:3000;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 100;
}


# ============================================
# HTTPS — direct access to VPS (self-signed)
# ============================================
server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /api/search {
        limit_req zone=search_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nuxt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/suggest {
        limit_req zone=general_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://nuxt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        proxy_pass http://nuxt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
