use_default_settings: false
search:
  safe_search: 2
  autocomplete: "google"
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "set-via-SEARXNG_SECRET-env"
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  cors_enabled: false

engines:
  - name: DuckDuckGo
    engine: duckduckgo
    shortcut: ddg
  - name: Bing
    engine: bing
    shortcut: bing
  - name: Google
    engine: google
    shortcut: g
