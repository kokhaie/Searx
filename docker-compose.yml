# Single-file stack — `docker compose up` is all you need:
# pulls the Nuxt app and ai-filter images from GHCR (built by GitHub
# Actions) and runs them together with upstream SearXNG and Valkey.
#
# Topology:
#   browser ──> app (Nuxt, the ONLY published port, :3000)
#                 └── server proxy ──> core (SearXNG, internal network only)
#
# The browser never contacts SearXNG (all search goes through the app's
# /api/* proxy), so the SearXNG container needs no host port, no CORS and
# no rate limiter. `searxng/core-config/settings.yml` is baked into the
# repo (JSON format on, limiter off) so nothing has to be configured.

name: search-engine

services:
  core:
    container_name: search-searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    volumes:
      - ./searxng/core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
    environment:
      # Internal-only instance; base URL mostly affects links/cookies.
      - SEARXNG_BASE_URL=http://localhost:8080/
      # Optional: set a real secret in a .env file (openssl rand -hex 32).
      # The fallback lets `docker compose up` run with zero preparation.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-please-change-this-dev-secret}
    # Intentionally no `ports:` — SearXNG stays private.
    expose:
      - 8080
    networks:
      - searxnet

  valkey:
    container_name: search-searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 300 1 --save 60 1000 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/
    networks:
      - searxnet

  ai-filter:
    container_name: search-ai-filter
    # Built and pushed to GHCR by .github/workflows/docker.yml
    image: ghcr.io/kokhaie/searx/ai-filter:${AI_FILTER_TAG:-latest}
    restart: always
    environment:
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - 8000
    networks:
      - searxnet

  app:
    container_name: search-app
    image: ${APP_IMAGE:-ghcr.io/kokhaie/searx/app:${APP_TAG:-latest}}
    restart: always
    depends_on:
      core:
        condition: service_started
      ai-filter:
        condition: service_healthy
    environment:
      # Server-side proxy target on the internal network — the only link
      # between the frontend and SearXNG.
      NUXT_SEARX_URL: http://core:8080
      # AI filter microservice (Python FastAPI)
      AI_FILTER_URL: http://ai-filter:8000
      # Valkey search-response cache (5 min TTL)
      # ioredis/redis clients use the redis:// scheme even when talking to Valkey
      VALKEY_URL: redis://valkey:6379
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    expose:
      - 3000
    networks:
      - searxnet

  nginx:
    container_name: search-nginx
    image: nginx:alpine
    restart: always
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - 443:443
    networks:
      - searxnet

volumes:
  core-data:
  valkey-data:

networks:
  searxnet:
